# Per-market MM presets. Any symbol not listed inherits `defaults`.
# spread_bps: half-spread from mid, in basis points
# requote_bps: drift threshold before an order is repriced
# order_size_usd: target notional per side (>= $10 USDG venue minimum)
# leverage: informational cap used for sizing sanity checks
# refresh_ms: tick cadence for the market worker

defaults:
  spread_bps: 0.15      # Breads default (join-at-best rule caps quotes at the book anyway)
  requote_bps: 0.25     # keep queue position: don't churn on sub-quarter-bps drift
  order_size_usd: 25
  leverage: 5
  refresh_ms: 12000     # Breads default
  min_edge_bps: 0.5     # don't quote when the book spread can't pay for the risk
  vol_breaker_bps: 2.5  # pull all quotes when per-tick vol exceeds this

crypto_majors:  # tighter spread, larger size
  BTC: {spread_bps: 0.12, order_size_usd: 50, leverage: 5}
  ETH: {spread_bps: 0.12, order_size_usd: 50, leverage: 5}
  SOL: {spread_bps: 0.15, order_size_usd: 30, leverage: 5}

crypto_mid:
