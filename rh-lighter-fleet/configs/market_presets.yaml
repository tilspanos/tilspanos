  HYPE: {spread_bps: 0.18, order_size_usd: 25, leverage: 3}
  XRP:  {spread_bps: 0.15, order_size_usd: 25, leverage: 5}
  ZEC:  {spread_bps: 0.20, order_size_usd: 25, leverage: 3}
  NEAR: {spread_bps: 0.20, order_size_usd: 25, leverage: 3}
  SUI:  {spread_bps: 0.20, order_size_usd: 25, leverage: 3}
  VVV:  {spread_bps: 0.30, order_size_usd: 15, leverage: 2}

