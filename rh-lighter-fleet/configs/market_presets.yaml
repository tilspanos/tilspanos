  SPY:  {spread_bps: 0.18, order_size_usd: 30, leverage: 3}
  QQQ:  {spread_bps: 0.18, order_size_usd: 30, leverage: 3}
  AAPL: {spread_bps: 0.22, order_size_usd: 25, leverage: 3}
  MSFT: {spread_bps: 0.22, order_size_usd: 25, leverage: 3}
  GOOGL: {spread_bps: 0.22, order_size_usd: 25, leverage: 3}
  AMZN: {spread_bps: 0.22, order_size_usd: 25, leverage: 3}
  META: {spread_bps: 0.22, order_size_usd: 25, leverage: 3}
